name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build SPA
        run: |
          npm ci
          npm run build
          rm -rf internal/web/dist && mkdir -p internal/web/dist
          cp -r public/build internal/web/dist/build
          cp -r public/favicons public/images public/fonts public/desktop-version internal/web/dist/
          cp public/favicon.ico public/robots.txt public/security.txt internal/web/dist/
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/dvorinka/tock
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
