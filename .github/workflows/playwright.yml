name: Playwright Tests
on: [push]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    services:
      mailpit:
        image: 'axllent/mailpit:latest'
        ports:
          - 1025:1025
          - 8025:8025
      pgsql:
        image: postgres:16
        env:
          POSTGRES_DB: 'tock'
          POSTGRES_USER: 'tock'
          POSTGRES_PASSWORD: 'tock'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup node"
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: "Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Install dependencies"
        run: npm ci

      - name: "Build SPA"
        run: |
          npm run build
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -r public/build internal/web/dist/build
          cp -r public/favicons public/images public/fonts public/desktop-version internal/web/dist/ || true
          cp public/favicon.ico public/robots.txt public/security.txt internal/web/dist/ || true

      - name: "Build tock"
        run: go build -o bin/tock ./cmd/tock

      - name: "Migrate and seed"
        env:
          TOCK_DB_DSN: 'postgres://tock:tock@127.0.0.1:5432/tock?sslmode=disable'
        run: |
          ./bin/tock migrate
          ./bin/tock seed

      - name: "Start tock"
        env:
          TOCK_DB_DSN: 'postgres://tock:tock@127.0.0.1:5432/tock?sslmode=disable'
          TOCK_ADDR: ':8000'
          TOCK_APP_URL: 'http://localhost:8000'
          TOCK_SMTP_ADDR: 'localhost:1025'
          TOCK_STORAGE_DIR: 'storage'
        run: ./bin/tock serve > tock.log 2>&1 &

      - name: "Install Playwright browsers"
        run: npx playwright install --with-deps

      - name: "Run Playwright tests"
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:8000'
          MAILPIT_BASE_URL: 'http://localhost:8025'

      - name: "Upload test results"
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30

      - name: "Upload tock log"
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: tock-log-${{ matrix.shardIndex }}
          path: tock.log
          retention-days: 7
