name: NPM Format Check
on: [push]
permissions:
  contents: read
jobs:
  format-check:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
      - name: "Use Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: "Install npm dependencies"
        run: npm ci
      - name: "Check code formatting"
        run: npm run format:check
