version: 2
project_name: tock

builds:
  - id: tock
    binary: tock
    main: ./cmd/tock
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.md
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Dvorinka
    name: tock
